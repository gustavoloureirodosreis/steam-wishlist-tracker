name: Daily wishlist check

on:
  schedule:
    - cron: "30 11 * * *"   # 08:30 America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        run: python tracker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json today.json docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily wishlist update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
